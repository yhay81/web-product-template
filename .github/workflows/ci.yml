name: ci

on:
  pull_request:
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - run: npm run check
      - run: npm test
      - run: npm run build
